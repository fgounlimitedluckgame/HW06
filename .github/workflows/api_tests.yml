name: Automated API Test Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  api-regression-tests:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: ./eshop-sut/backend/package-lock.json

      - name: 3. Install SUT Dependencies & Global Newman Runner
        run: |
          npm ci
          npm install -g newman newman-reporter-htmlextra

      - name: 4. Launch SUT Server in Background
        working-directory: ./eshop-sut/backend
        run: |
          node server.js &

      - name: 5. Wait for SUT Server Readiness
        working-directory: ./eshop-sut/backend
        run: |
          npx wait-on http://localhost:3000 -t 30000

      - name: 6. Run Newman on CI Active Test Suites
        continue-on-error: true
        run: |
          mkdir -p ./reports
          for file in ./ci_tests/*.csv; do
            [ -f "$file" ] || continue
            suite_name=$(basename "$file" .csv)
            echo "Executing CI Test Suite: $suite_name"
            
            newman run hw06.postman_collection.json \
              -d "$file" \
              --environment hw06.postman_environment.json \
              --reporters cli,htmlextra \
              --reporter-htmlextra-export "./reports/${suite_name}-report.html"
          done

      - name: 7. Archive Test Report Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: newman-execution-reports
          path: ./reports/
          retention-days: 14